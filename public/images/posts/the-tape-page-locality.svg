<svg xmlns="http://www.w3.org/2000/svg" width="920" height="595" viewBox="0 0 920 595" role="img" aria-labelledby="title desc">
<title id="title">Cache-line locality in a B-tree</title><desc id="desc">A B-tree page contains many keys. One cache-line fetch brings a subset of adjacent keys, not the entire page.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#2B669D"/></marker></defs>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}
.title{font-size:32px;font-weight:700}
.subtitle{font-size:22px;fill:#667988}
.section{font-size:25px;font-weight:700}
.nodeText{font-size:24px;font-weight:700}
.nodeMuted{font-size:23px;font-weight:600;fill:#7B8791}
.num{font-size:22px;font-weight:700;fill:#516A7C}
.body{font-size:22px}
.note{font-size:21px;fill:#667988}
.strong{font-size:25px;font-weight:700;fill:#2B669D}
</style>
<rect x="2" y="2" width="916" height="591" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="36" y="53" class="title" text-anchor="start">A cache line is smaller than a B-tree page</text><text x="36" y="91" class="subtitle" text-anchor="start">A fetch brings adjacent keys into L1, not the entire page.</text><rect x="38" y="133" width="844" height="171" rx="16" fill="#FFFFFF" stroke="#687A89" stroke-width="2"/><text x="62" y="172" class="section" text-anchor="start">B-tree page in main memory</text><rect x="66" y="200" width="88" height="71" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="110" y="244.5" class="nodeText" text-anchor="middle">k0</text><rect x="165" y="200" width="88" height="71" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="209" y="244.5" class="nodeText" text-anchor="middle">k1</text><rect x="264" y="200" width="88" height="71" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="308" y="244.5" class="nodeText" text-anchor="middle">k2</text><rect x="363" y="200" width="88" height="71" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="407" y="244.5" class="nodeText" text-anchor="middle">k3</text><rect x="462" y="200" width="88" height="71" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="506" y="244.5" class="nodeText" text-anchor="middle">k4</text><rect x="561" y="200" width="88" height="71" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="605" y="244.5" class="nodeText" text-anchor="middle">k5</text><rect x="660" y="200" width="88" height="71" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="704" y="244.5" class="nodeText" text-anchor="middle">k6</text><rect x="759" y="200" width="88" height="71" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="803" y="244.5" class="nodeText" text-anchor="middle">k7</text><path d="M 264 319 v13 h386 v-13" fill="none" stroke="#2B669D" stroke-width="3"/><text x="457" y="360" class="body" text-anchor="middle">One fetched cache line</text><line x1="457" y1="368" x2="457" y2="390" stroke="#2B669D" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="224" y="410" width="650" height="112" rx="16" fill="#F0F5FA" stroke="#B8CEDF" stroke-width="2"/><text x="249" y="454" class="section" text-anchor="start">L1 cache</text><rect x="442" y="430" width="88" height="70" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="486" y="474" class="nodeText" text-anchor="middle">k2</text><rect x="542" y="430" width="88" height="70" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="586" y="474" class="nodeText" text-anchor="middle">k3</text><rect x="642" y="430" width="88" height="70" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="686" y="474" class="nodeText" text-anchor="middle">k4</text><rect x="742" y="430" width="88" height="70" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="786" y="474" class="nodeText" text-anchor="middle">k5</text><text x="38" y="565" class="note" text-anchor="start">Nearby lookups can reuse those cached keys.</text>
