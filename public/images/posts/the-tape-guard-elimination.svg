<svg xmlns="http://www.w3.org/2000/svg" width="920" height="687" viewBox="0 0 920 687" role="img" aria-labelledby="title desc">
<title id="title">Guard elimination with a proof</title><desc id="desc">Before, the array read has a bounds guard; on the true branch, unsigned i is less than the length; after proof, the redundant bounds guard is a Nop but the read and other effects remain.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#2B669D"/></marker></defs>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}
.title{font-size:32px;font-weight:700}
.subtitle{font-size:22px;fill:#667988}
.section{font-size:25px;font-weight:700}
.nodeText{font-size:24px;font-weight:700}
.nodeMuted{font-size:23px;font-weight:600;fill:#7B8791}
.num{font-size:22px;font-weight:700;fill:#516A7C}
.body{font-size:22px}
.note{font-size:21px;fill:#667988}
.strong{font-size:25px;font-weight:700;fill:#2B669D}
</style>
<rect x="2" y="2" width="916" height="683" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="36" y="53" class="title" text-anchor="start">One proof can remove a redundant bounds check</text><text x="36" y="89" class="subtitle" text-anchor="start">The read stays. Any other required effects also stay.</text><rect x="36" y="111" width="848" height="168" rx="16" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="60" y="149" class="section" text-anchor="start">1  Before: the read still has a bounds guard</text><rect x="62" y="175" width="162" height="78" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="143" y="223" class="nodeText" text-anchor="middle">Len(a)</text><rect x="273" y="175" width="162" height="78" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="354" y="223" class="nodeText" text-anchor="middle">Branch</text><rect x="484" y="175" width="162" height="78" rx="11" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="565" y="223" class="nodeText" text-anchor="middle">Guard</text><rect x="695" y="175" width="162" height="78" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="776" y="223" class="nodeText" text-anchor="middle">Read a[i]</text><rect x="36" y="295" width="848" height="121" rx="16" fill="#EDF4FA" stroke="#C3D6E5" stroke-width="2"/><text x="60" y="333" class="section" text-anchor="start">2  Proof on the true branch</text><rect x="485" y="314" width="340" height="62" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="655" y="352" class="strong" text-anchor="middle">unsigned i &lt; len(a)</text><text x="60" y="385" class="body" text-anchor="start">Same array and index; no invalidating change.</text><rect x="36" y="433" width="848" height="168" rx="16" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="60" y="472" class="section" text-anchor="start">3  After: only the redundant bounds check is removed</text><rect x="62" y="495" width="162" height="78" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="143" y="543" class="nodeText" text-anchor="middle">Len(a)</text><rect x="273" y="495" width="162" height="78" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="354" y="543" class="nodeText" text-anchor="middle">Branch</text><rect x="484" y="495" width="162" height="78" rx="11" fill="#ECEFF2" stroke="#687A89" stroke-width="2" stroke-dasharray="8 6"/><text x="565" y="543" class="nodeMuted" text-anchor="middle">Nop</text><rect x="695" y="495" width="162" height="78" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="776" y="543" class="nodeText" text-anchor="middle">Read a[i]</text><line x1="511" y1="553" x2="620" y2="512" stroke="#A44E33" stroke-width="3" stroke-linecap="round"/><text x="36" y="651" class="note" text-anchor="start">Effects not proved redundant must still execute.</text>
</svg>