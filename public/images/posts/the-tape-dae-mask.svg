<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="691" viewBox="0 0 1000 691" role="img" aria-labelledby="title desc">
<title id="title">DAE private argument mask and emission filter</title><desc id="desc">A private per-callee mask keeps ordinal zero, drops ordinal one, and keeps ordinal two. Call nodes retain all three original actual positions in the IR. Native emission produces only arguments zero and two with no runtime filter or shared Wasm type change.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B669D"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}.title{font-size:31px;font-weight:700}.subtitle{font-size:20px;fill:#617383}.section{font-size:25px;font-weight:700}.name{font-size:25px;font-weight:700}.body{font-size:21px}.caption{font-size:19px;fill:#617383}.small{font-size:18px;font-weight:700;fill:#5C7182}.mono{font-family:Consolas,monospace;font-size:22px;font-weight:700}.seq{font-size:18px;font-weight:700}</style>
<rect x="2" y="2" width="996" height="687" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="40" y="52" class="title" text-anchor="start">One bit per parameter slot</text><text x="40" y="87" class="subtitle" text-anchor="start">Decide once. Filter only when native code is emitted.</text><text x="40" y="136" class="section" text-anchor="start">Private demand mask for a callee</text><rect x="77" y="162" width="269" height="95" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="211.5" y="194" class="caption" text-anchor="middle">parameter 0</text><text x="211.5" y="231" class="section" text-anchor="middle">KEEP</text><rect x="378" y="162" width="269" height="95" rx="13" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="512.5" y="194" class="caption" text-anchor="middle">parameter 1</text><text x="512.5" y="231" class="section" text-anchor="middle">DROP</text><rect x="679" y="162" width="269" height="95" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="813.5" y="194" class="caption" text-anchor="middle">parameter 2</text><text x="813.5" y="231" class="section" text-anchor="middle">KEEP</text><text x="40" y="309" class="section" text-anchor="start">Call node and actual list stay intact</text><rect x="78" y="336" width="268" height="70" rx="12" fill="#ECEFF2" stroke="#687A89" stroke-width="2"/><text x="212" y="379" class="name" text-anchor="middle">arg 0</text><rect x="379" y="336" width="268" height="70" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="513" y="379" class="name" text-anchor="middle">arg 1</text><rect x="680" y="336" width="268" height="70" rx="12" fill="#ECEFF2" stroke="#687A89" stroke-width="2"/><text x="814" y="379" class="name" text-anchor="middle">arg 2</text><path d="M499 412 L499 481" fill="none" stroke="#2B669D" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="515" class="section" text-anchor="start">Emitted private call ABI</text><rect x="156" y="539" width="269" height="74" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="290.5" y="585" class="name" text-anchor="middle">arg 0</text><rect x="575" y="539" width="269" height="74" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="709.5" y="585" class="name" text-anchor="middle">arg 2</text><text x="40" y="659" class="caption" text-anchor="start">No public Wasm type change. No runtime filter. No tape compaction.</text>
</svg>