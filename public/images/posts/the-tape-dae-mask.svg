<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="650" viewBox="0 0 1220 650" role="img" aria-label="Three parameter positions, mask keep drop keep, call structure unchanged, native call only passes first and third arguments.">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4278B4"/></marker></defs>
<rect x="2" y="2" width="1216" height="646" rx="24" fill="#FAF8F5" stroke="#E6E9EC" stroke-width="2"/>
<text x="46" y="65" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#203447">Dead argument elimination: skip unused inputs</text><text x="46" y="105" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#607584">The private mask is applied once when native code is emitted.</text>
<text x="48" y="149" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447">Private parameter mask</text><rect x="78" y="177" width="305" height="101" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="230.5" y="211" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#607584" text-anchor="middle">parameter 0</text><text x="230.5" y="257" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#203447" text-anchor="middle">KEEP</text><rect x="458" y="177" width="305" height="101" rx="14" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="610.5" y="211" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#607584" text-anchor="middle">parameter 1</text><text x="610.5" y="257" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#203447" text-anchor="middle">DROP</text><rect x="838" y="177" width="305" height="101" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="990.5" y="211" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#607584" text-anchor="middle">parameter 2</text><text x="990.5" y="257" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#203447" text-anchor="middle">KEEP</text><text x="48" y="335" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#203447">Call node: all three argument positions stay unchanged</text><rect x="78" y="355" width="305" height="70" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="230.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">arg 0</text><rect x="458" y="355" width="305" height="70" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="610.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">arg 1</text><rect x="838" y="355" width="305" height="70" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="990.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">arg 2</text><text x="48" y="490" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#203447">Emitted machine-code call: only live arguments remain</text><rect x="208" y="512" width="305" height="70" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="360.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">arg 0</text><rect x="706" y="512" width="305" height="70" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="858.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">arg 2</text><rect x="48" y="601" width="1124" height="37" rx="10" fill="#F0F5FA" stroke="#C5D6E5" stroke-width="1"/><text x="610" y="626" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#203447" text-anchor="middle">The shared function type stays unchanged. No runtime mask check.</text>
