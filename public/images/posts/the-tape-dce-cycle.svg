<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-label="The dead-code cleanup cycle: remove unused work, shorten the schedule, speed up later passes, and expose more optimization opportunities.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4278B4"/></marker></defs>
<rect x="2" y="2" width="836" height="756" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#203447">
<text x="40" y="57" font-size="34" font-weight="700">Each cleanup helps the next pass</text>
<text x="40" y="94" font-size="23" fill="#617383">The tape keeps node IDs; the active schedule can shrink.</text>
</g>
<rect x="48" y="130" width="744" height="109" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/>
<text x="78" y="172" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#203447">1. Remove unused calculations</text>
<text x="78" y="208" font-size="21" font-family="Arial,Helvetica,sans-serif" fill="#617383">Their inputs may become unused too.</text>
<path d="M420 244 V271" fill="none" stroke="#4278B4" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="48" y="278" width="744" height="109" rx="14" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/>
<text x="78" y="321" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#203447">2. Remove dead blocks and entries</text>
<text x="78" y="355" font-size="21" font-family="Arial,Helvetica,sans-serif" fill="#617383">The active schedule becomes shorter.</text>
<path d="M420 392 V419" fill="none" stroke="#4278B4" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="48" y="426" width="744" height="109" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/>
<text x="78" y="469" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#203447">3. Later passes inspect less work</text>
<text x="78" y="503" font-size="21" font-family="Arial,Helvetica,sans-serif" fill="#617383">They can finish sooner and find more changes.</text>
<path d="M420 540 V567" fill="none" stroke="#4278B4" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="48" y="574" width="744" height="100" rx="14" fill="#ECEFF2" stroke="#728291" stroke-width="2"/>
<text x="78" y="618" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#203447">4. Repeat while it helps</text>
<text x="78" y="653" font-size="21" font-family="Arial,Helvetica,sans-serif" fill="#617383">Stop when another pass offers little benefit.</text>
<text x="420" y="717" font-size="21" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#617383">Required guards and effects still stay in order.</text>
</svg>