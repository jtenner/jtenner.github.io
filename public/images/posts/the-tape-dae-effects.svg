<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" role="img" aria-labelledby="title desc">
<title id="title">Dead argument NOP leaves effects in schedule</title><desc id="desc">Before DAE, a scheduled argument expression includes a guard, side effect, argument value, and call. After DAE, the argument value occurrence is a NOP, but the guard and side effect remain in the schedule and execute. The call shape stays unchanged.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B669D"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}.title{font-size:31px;font-weight:700}.subtitle{font-size:20px;fill:#617383}.section{font-size:25px;font-weight:700}.name{font-size:25px;font-weight:700}.body{font-size:21px}.caption{font-size:19px;fill:#617383}.small{font-size:18px;font-weight:700;fill:#5C7182}.mono{font-family:Consolas,monospace;font-size:22px;font-weight:700}.seq{font-size:18px;font-weight:700}</style>
<rect x="2" y="2" width="996" height="642" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="40" y="50" class="title" text-anchor="start">Dead Argument Elimination: keep effects, drop values</text><text x="40" y="85" class="subtitle" text-anchor="start">One argument is not demanded by the callee.</text><text x="42" y="135" class="section" text-anchor="start">Before · scheduled nodes</text><rect x="42" y="155" width="207" height="101" rx="13" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="145.5" y="189" class="small" text-anchor="middle">#20</text><text x="145.5" y="225" class="name" text-anchor="middle">Guard</text><rect x="279" y="155" width="207" height="101" rx="13" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="382.5" y="189" class="small" text-anchor="middle">#21</text><text x="382.5" y="225" class="name" text-anchor="middle">Side effect</text><rect x="516" y="155" width="207" height="101" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="619.5" y="189" class="small" text-anchor="middle">#22</text><text x="619.5" y="225" class="name" text-anchor="middle">Arg value</text><rect x="753" y="155" width="207" height="101" rx="13" fill="#F0F5FA" stroke="#687A89" stroke-width="2"/><text x="856.5" y="189" class="small" text-anchor="middle">#23</text><text x="856.5" y="225" class="name" text-anchor="middle">Call f</text><text x="42" y="288" class="section" text-anchor="start">After · only the unused argument value is nopped</text><rect x="42" y="311" width="207" height="101" rx="13" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="145.5" y="345" class="small" text-anchor="middle">#20</text><text x="145.5" y="381" class="name" text-anchor="middle">Guard</text><rect x="279" y="311" width="207" height="101" rx="13" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="382.5" y="345" class="small" text-anchor="middle">#21</text><text x="382.5" y="381" class="name" text-anchor="middle">Side effect</text><rect x="516" y="311" width="207" height="101" rx="13" fill="#ECEFF2" stroke="#687A89" stroke-width="2" stroke-dasharray="8 6"/><text x="619.5" y="345" class="small" text-anchor="middle">#22</text><text x="619.5" y="381" class="caption" text-anchor="middle">NOP</text><rect x="753" y="311" width="207" height="101" rx="13" fill="#F0F5FA" stroke="#687A89" stroke-width="2"/><text x="856.5" y="345" class="small" text-anchor="middle">#23</text><text x="856.5" y="381" class="name" text-anchor="middle">Call f</text><rect x="40" y="453" width="920" height="111" rx="15" fill="#F0F5FA" stroke="#C3D6E5" stroke-width="1.5"/><text x="62" y="490" class="body" text-anchor="start">Guards and side effects are separate scheduled nodes.</text><text x="62" y="523" class="body" text-anchor="start">The NOP only removes value work. Traps and effects still execute.</text><text x="40" y="611" class="caption" text-anchor="start">The callee's private mask skips this argument during native-code emission.</text>
</svg>