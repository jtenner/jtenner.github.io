<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620" role="img" aria-label="Before, separate bounds check, side effect, argument value and call are scheduled. After, only the unused value becomes NOP; required effects and call remain.">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4278B4"/></marker></defs>
<rect x="2" y="2" width="1216" height="616" rx="24" fill="#FAF8F5" stroke="#E6E9EC" stroke-width="2"/>
<text x="46" y="65" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#203447">Dead arguments: remove values, keep effects</text><text x="46" y="105" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#607584">The call still runs, and its required checks still run.</text>
<text x="48" y="154" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447">Before: a call computes an unused argument</text><rect x="55" y="177" width="250" height="102" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="180" y="211" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#20</text><text x="180" y="247" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Bounds check</text><rect x="348" y="177" width="250" height="102" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="473" y="211" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#21</text><text x="473" y="247" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Side effect</text><rect x="641" y="177" width="250" height="102" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="766" y="211" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#22</text><text x="766" y="247" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Arg value</text><rect x="934" y="177" width="250" height="102" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="1059" y="211" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#23</text><text x="1059" y="247" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Call f</text><text x="48" y="329" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447">After: the unused value becomes NOP</text><rect x="55" y="350" width="250" height="102" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="180" y="384" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#20</text><text x="180" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Bounds check</text><rect x="348" y="350" width="250" height="102" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="473" y="384" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#21</text><text x="473" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Side effect</text><rect x="641" y="350" width="250" height="102" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2" stroke-dasharray="9 7"/><text x="766" y="390" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#22</text><text x="766" y="427" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#607584" text-anchor="middle">NOP</text><rect x="934" y="350" width="250" height="102" rx="12" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="1059" y="384" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#607584" text-anchor="middle">#23</text><text x="1059" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#203447" text-anchor="middle">Call f</text><rect x="45" y="490" width="1130" height="94" rx="14" fill="#F0F5FA" stroke="#C5D6E5" stroke-width="2"/><text x="66" y="529" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#203447">The two effect nodes still run in the same order.</text><text x="66" y="560" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#607584">Only the unused value work is removed. Other live uses remain intact.</text>
</svg>