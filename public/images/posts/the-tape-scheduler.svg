<svg xmlns="http://www.w3.org/2000/svg" width="920" height="601" viewBox="0 0 920 601" role="img" aria-labelledby="title desc">
<title id="title">Safe schedule reordering</title><desc id="desc">The tape is unchanged; pure Add #9 moves earlier in the schedule, while Guard #6, Get #8 and Store #11 retain their relative order.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#2B669D"/></marker></defs>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}
.title{font-size:32px;font-weight:700}
.subtitle{font-size:22px;fill:#667988}
.section{font-size:25px;font-weight:700}
.nodeText{font-size:24px;font-weight:700}
.nodeMuted{font-size:23px;font-weight:600;fill:#7B8791}
.num{font-size:22px;font-weight:700;fill:#516A7C}
.body{font-size:22px}
.note{font-size:21px;fill:#667988}
.strong{font-size:25px;font-weight:700;fill:#2B669D}
</style>
<rect x="2" y="2" width="916" height="597" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="36" y="53" class="title" text-anchor="start">Reorder the schedule, not the tape</text><text x="36" y="89" class="subtitle" text-anchor="start">The node IDs and their locations never change.</text><rect x="38" y="132" width="126" height="94" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="101" y="163" class="num" text-anchor="middle">#3</text><text x="101" y="198" class="nodeText" text-anchor="middle">Len</text><rect x="179" y="132" width="126" height="94" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="242" y="163" class="num" text-anchor="middle">#5</text><text x="242" y="198" class="nodeText" text-anchor="middle">Less</text><rect x="320" y="132" width="126" height="94" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="383" y="163" class="num" text-anchor="middle">#6</text><text x="383" y="198" class="nodeText" text-anchor="middle">Guard</text><rect x="461" y="132" width="126" height="94" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="524" y="163" class="num" text-anchor="middle">#8</text><text x="524" y="198" class="nodeText" text-anchor="middle">Get</text><rect x="602" y="132" width="126" height="94" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="665" y="163" class="num" text-anchor="middle">#9</text><text x="665" y="198" class="nodeText" text-anchor="middle">Add</text><rect x="743" y="132" width="126" height="94" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="806" y="163" class="num" text-anchor="middle">#11</text><text x="806" y="198" class="nodeText" text-anchor="middle">Store</text><text x="38" y="274" class="section" text-anchor="start">Before</text><text x="38" y="393" class="section" text-anchor="start">After</text><rect x="300" y="243" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="342" y="285" class="nodeText" text-anchor="middle">3</text><rect x="396" y="243" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="438" y="285" class="nodeText" text-anchor="middle">5</text><rect x="492" y="243" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="534" y="285" class="nodeText" text-anchor="middle">6</text><rect x="588" y="243" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="630" y="285" class="nodeText" text-anchor="middle">8</text><rect x="684" y="243" width="84" height="66" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="726" y="285" class="nodeText" text-anchor="middle">9</text><rect x="780" y="243" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="822" y="285" class="nodeText" text-anchor="middle">11</text><rect x="300" y="361" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="342" y="403" class="nodeText" text-anchor="middle">3</text><rect x="396" y="361" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="438" y="403" class="nodeText" text-anchor="middle">5</text><rect x="492" y="361" width="84" height="66" rx="11" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="534" y="403" class="nodeText" text-anchor="middle">9</text><rect x="588" y="361" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="630" y="403" class="nodeText" text-anchor="middle">6</text><rect x="684" y="361" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="726" y="403" class="nodeText" text-anchor="middle">8</text><rect x="780" y="361" width="84" height="66" rx="11" fill="#FFFFFF" stroke="#C8D1D9" stroke-width="2"/><text x="822" y="403" class="nodeText" text-anchor="middle">11</text><path d="M 724 313 C 724 342, 534 334, 534 357" fill="none" stroke="#2B669D" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><rect x="36" y="477" width="848" height="97" rx="13" fill="#F0F5FA" stroke="#C7D8E8" stroke-width="1.5"/><text x="58" y="514" class="section" text-anchor="start">Only independent values may move.</text><text x="58" y="547" class="body" text-anchor="start">Guards and other effects retain their required order.</text>
</svg>