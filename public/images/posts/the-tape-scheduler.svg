<svg xmlns="http://www.w3.org/2000/svg" width="780" height="662" viewBox="0 0 780 662" role="img" aria-labelledby="title desc">
<title id="title">Fixed instruction tape and independent scheduler</title><desc id="desc">The instruction tape contains stable numbered nodes. A separate scheduler holds node IDs. Independent Add node 9 moves earlier in the scheduler while the tape remains unchanged and required effects remain in order.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#2B669D"/></marker></defs>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}
.title{font-size:34px;font-weight:700}
.subtitle{font-size:22px;fill:#617383}
.section{font-size:27px;font-weight:700}
.nodeName{font-size:24px;font-weight:700}
.nodeID{font-size:21px;font-weight:700;fill:#526879}
.num{font-size:27px;font-weight:700}
.body{font-size:23px}
.note{font-size:22px;fill:#617383}
</style>
<rect x="2" y="2" width="776" height="658" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="36" y="50" class="title" text-anchor="start">Two structures, two jobs</text><text x="36" y="82" class="subtitle" text-anchor="start">Fixed nodes hold computations. A separate list sets the order.</text><text x="38" y="131" class="section" text-anchor="start">Instruction tape · fixed storage</text><rect x="41" y="155" width="105" height="98" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="93.5" y="193" class="nodeID" text-anchor="middle">#3</text><text x="93.5" y="230" class="nodeName" text-anchor="middle">Len</text><rect x="160" y="155" width="105" height="98" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="212.5" y="193" class="nodeID" text-anchor="middle">#5</text><text x="212.5" y="230" class="nodeName" text-anchor="middle">Less</text><rect x="279" y="155" width="105" height="98" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="331.5" y="193" class="nodeID" text-anchor="middle">#6</text><text x="331.5" y="230" class="nodeName" text-anchor="middle">Guard</text><rect x="398" y="155" width="105" height="98" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="450.5" y="193" class="nodeID" text-anchor="middle">#8</text><text x="450.5" y="230" class="nodeName" text-anchor="middle">Get</text><rect x="517" y="155" width="105" height="98" rx="12" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="569.5" y="193" class="nodeID" text-anchor="middle">#9</text><text x="569.5" y="230" class="nodeName" text-anchor="middle">Add</text><rect x="636" y="155" width="105" height="98" rx="12" fill="#FDE9BE" stroke="#BE820A" stroke-width="2"/><text x="688.5" y="193" class="nodeID" text-anchor="middle">#11</text><text x="688.5" y="230" class="nodeName" text-anchor="middle">Store</text><text x="38" y="309" class="section" text-anchor="start">Scheduler · list of node IDs</text><text x="38" y="376" class="section" text-anchor="start">Before</text><text x="38" y="493" class="section" text-anchor="start">After</text><rect x="190" y="337" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="227.5" y="379" class="num" text-anchor="middle">3</text><rect x="281" y="337" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="318.5" y="379" class="num" text-anchor="middle">5</text><rect x="372" y="337" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="409.5" y="379" class="num" text-anchor="middle">6</text><rect x="463" y="337" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="500.5" y="379" class="num" text-anchor="middle">8</text><rect x="554" y="337" width="75" height="64" rx="10" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="591.5" y="379" class="num" text-anchor="middle">9</text><rect x="645" y="337" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="682.5" y="379" class="num" text-anchor="middle">11</text><rect x="190" y="454" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="227.5" y="496" class="num" text-anchor="middle">3</text><rect x="281" y="454" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="318.5" y="496" class="num" text-anchor="middle">5</text><rect x="372" y="454" width="75" height="64" rx="10" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="409.5" y="496" class="num" text-anchor="middle">9</text><rect x="463" y="454" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="500.5" y="496" class="num" text-anchor="middle">6</text><rect x="554" y="454" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="591.5" y="496" class="num" text-anchor="middle">8</text><rect x="645" y="454" width="75" height="64" rx="10" fill="#FFFFFF" stroke="#CCD4DC" stroke-width="2"/><text x="682.5" y="496" class="num" text-anchor="middle">11</text><path d="M 591 407 C 591 445 410 427 410 449" fill="none" stroke="#2B669D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="38" y="549" width="704" height="88" rx="12" fill="#F0F5FA" stroke="#C7D8E8" stroke-width="1.5"/><text x="60" y="583" class="body" text-anchor="start">#9 Add is independent, so its schedule entry can move.</text><text x="60" y="617" class="body" text-anchor="start">The guard and store keep their required order.</text>
</svg>