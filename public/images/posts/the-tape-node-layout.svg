<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="434" viewBox="0 0 1008 434" role="img" aria-labelledby="title desc">
<title id="title">NIR node's 16-byte storage layout</title><desc id="desc">One 16-byte node has a one-byte kind, three reserved bytes, and three 32-bit fields named a, b, c. The meaning of the fields depends on the kind. Variable-length data can be held in a side arena.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B669D"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#203447}.title{font-size:31px;font-weight:700}.subtitle{font-size:20px;fill:#617383}.section{font-size:25px;font-weight:700}.name{font-size:25px;font-weight:700}.body{font-size:21px}.caption{font-size:19px;fill:#617383}.small{font-size:18px;font-weight:700;fill:#5C7182}.mono{font-family:Consolas,monospace;font-size:22px;font-weight:700}.seq{font-size:18px;font-weight:700}</style>
<rect x="2" y="2" width="1004" height="430" rx="22" fill="#FAF8F5" stroke="#E5E9ED" stroke-width="2"/>
<text x="40" y="54" class="title" text-anchor="start">One tape node is 16 bytes</text><text x="40" y="86" class="subtitle" text-anchor="start">A C-style view of the current NIR record</text><rect x="40" y="135" width="220" height="142" rx="13" fill="#ECEFF2" stroke="#687A89" stroke-width="2"/><text x="150" y="175" class="name" text-anchor="middle">kind + pad</text><text x="150" y="212" class="small" text-anchor="middle">bytes 0–3</text><text x="150" y="253" class="caption" text-anchor="middle">1-byte kind + 3 reserved</text><rect x="276" y="135" width="220" height="142" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="386" y="175" class="name" text-anchor="middle">a</text><text x="386" y="212" class="small" text-anchor="middle">bytes 4–7</text><text x="386" y="253" class="caption" text-anchor="middle">32-bit field</text><rect x="512" y="135" width="220" height="142" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="622" y="175" class="name" text-anchor="middle">b</text><text x="622" y="212" class="small" text-anchor="middle">bytes 8–11</text><text x="622" y="253" class="caption" text-anchor="middle">32-bit field</text><rect x="748" y="135" width="220" height="142" rx="13" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="858" y="175" class="name" text-anchor="middle">c</text><text x="858" y="212" class="small" text-anchor="middle">bytes 12–15</text><text x="858" y="253" class="caption" text-anchor="middle">32-bit field</text><rect x="40" y="314" width="928" height="91" rx="14" fill="#F0F5FA" stroke="#C3D6E5" stroke-width="1.5"/><text x="62" y="350" class="body" text-anchor="start">The kind decides how the three 32-bit fields are interpreted.</text><text x="62" y="380" class="body" text-anchor="start">Extra operands and variable-length data can live in a side arena.</text>
</svg>