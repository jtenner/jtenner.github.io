<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Tape node layout with kind and padding bytes 0 to 3, fields a b c in the remaining 12 bytes, and a side arena for extra data.">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4278B4"/></marker></defs>
<rect x="2" y="2" width="1196" height="456" rx="24" fill="#FAF8F5" stroke="#E6E9EC" stroke-width="2"/>
<text x="46" y="65" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#203447">A tape node takes 16 bytes</text><text x="46" y="105" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#607584">Four 4-byte sections inside one fixed-size record</text>
<text x="50" y="161" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#607584">Offset</text><rect x="150" y="132" width="230" height="188" rx="14" fill="#ECEFF2" stroke="#728291" stroke-width="2"/><text x="265" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">kind + padding</text><text x="265" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#607584" text-anchor="middle">bytes 0–3</text><text x="265" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#203447" text-anchor="middle">1 + 3 bytes</text><rect x="404" y="132" width="230" height="188" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="519" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">a</text><text x="519" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#607584" text-anchor="middle">bytes 4–7</text><text x="519" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#203447" text-anchor="middle">4 bytes</text><rect x="658" y="132" width="230" height="188" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="773" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">b</text><text x="773" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#607584" text-anchor="middle">bytes 8–11</text><text x="773" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#203447" text-anchor="middle">4 bytes</text><rect x="912" y="132" width="230" height="188" rx="14" fill="#DCEAF8" stroke="#4278B4" stroke-width="2"/><text x="1027" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#203447" text-anchor="middle">c</text><text x="1027" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#607584" text-anchor="middle">bytes 12–15</text><text x="1027" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#203447" text-anchor="middle">4 bytes</text><rect x="44" y="350" width="1112" height="72" rx="14" fill="#F0F5FA" stroke="#C5D6E5" stroke-width="2"/><text x="66" y="381" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#203447">The kind tells the compiler how to read fields a, b, and c.</text><text x="66" y="409" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#607584">Extra data lives in a separate arena.</text>
</svg>